[project]
name = "adaptive-sonar-backend"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "E501"]
# Seeded PRNGs are intentional: the simulation must be reproducible, not cryptographic.
"app/sonar/**" = ["S311"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]
